# Postgres with the pgvector extension preinstalled.
#   docker compose up -d     (or: npm run db)
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatbot
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d chatbot']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
